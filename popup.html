<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Bro</title>
  <style>
    body {
      width: 320px;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f4f6f8;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 18px;
      text-align: center;
    }
    #chat-box {
      height: 220px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 8px;
      overflow-y: auto;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .input-container {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    button {
      padding: 8px 12px;
      background-color: #2da44e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #2c974b;
    }
    .status {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h2>Chat Bro 💬</h2>
  
  <div id="chat-box">
    <p style="color: #888;">Connecting to server...</p>
  </div>

  <div class="input-container">
    <input type="text" id="user-input" placeholder="Type a message...">
    <button id="send-btn">Send</button>
  </div>

  <div class="status" id="status-text">Server: Live 🟢</div>

  <script src="popup.js"></script>
</body>
</html>
